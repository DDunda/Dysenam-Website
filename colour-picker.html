<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Super Colour Picker</title>

		<link rel="stylesheet" href="/styles/colour-picker.css"/>
		<link rel="stylesheet" href="/styles/style.css"/>
		<script src="https://include.neocities.org/include.js"></script>
		<script src="/scripts/mark-nav.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/culori"></script>

		<!-- Generated with realfavicongenerator.net! -->
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/picker_icons/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/assets/picker_icons/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/assets/picker_icons/favicon-16x16.png">
		<link rel="manifest" href="/assets/picker_icons/site.webmanifest">
		<link rel="mask-icon" href="/assets/picker_icons/safari-pinned-tab.svg" color="#e750a5">
		<link rel="shortcut icon" href="/assets/picker_icons/favicon.ico">
		<meta name="msapplication-TileColor" content="#e750a5">
		<meta name="msapplication-config" content="/assets/picker_icons/browserconfig.xml">
		<meta name="theme-color" content="#ffffff">
	</head>
	<body>
		<script>include('/sections/header.html')</script>
		<main
			><figure
				><canvas class="picker" id="LABpicker"></canvas
				><canvas class="picker" id="HSVpicker"></canvas
			></figure
			><section class="frame" style="text-align: left" id="sliders"
				><div><h3>Luma</h3></div
				><div
					><label for="Luma_input">OkL</label
					><input id="Luma_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="Luma_input" type="number" min="0.0" max="1.0" step="any"
				></div
				><div
					><label for="Lr_input">OkLr</label
					><input id="Lr_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="Lr_input" type="number" min="0.0" max="1.0" step="any"
				></div

				><div><h3>OkLab</h3></div
				><div
					><label for="labA_input">A</label
					><input id="labA_input" type="range" min="-0.4" max="0.4" step="any" class="slider"
					><input id="labA_input" type="number" min="-0.4" max="0.4" step="any"
				></div
				><div
					><label for="labB_input">B</label
					><input id="labB_input" type="range" min="-0.4" max="0.4" step="any" class="slider"
					><input id="labB_input" type="number" min="-0.4" max="0.4" step="any"
				></div

				><div><h3>OkLch</h3></div
				><div
					><label for="lchC_input">Chroma</label
					><input id="lchC_input" type="range" min="0.0" max="0.4" step="any" class="slider"
					><input id="lchC_input" type="number" min="0.0" max="0.4" step="any"
				></div
				><div
					><label for="lchH_input">Hue</label
					><input id="lchH_input" type="range" min="0.0" max="360.0" step="any" class="slider"
					><input id="lchH_input" type="number" min="0.0" max="360.0" step="any"
				></div
				
				><div><h3>HSV</h3></div
				><div
					><label for="hsvH_input">Hue</label
					><input id="hsvH_input" type="range" min="0.0" max="360.0" step="any" class="slider"
					><input id="hsvH_input" type="number" min="0.0" max="360.0" step="any"
				></div
				><div
					><label for="hsvS_input">Saturation</label
					><input id="hsvS_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="hsvS_input" type="number" min="0.0" max="1.0" step="any"
				></div
				><div
					><label for="hsvV_input">Value</label
					><input id="hsvV_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="hsvV_input" type="number" min="0.0" max="1.0" step="any"
				></div
				
				><div><h3>sRGB</h3></div
				><div
					><label for="srgbR_input">Red</label
					><input id="srgbR_input" type="range" min="0.0" max="255.0" step="any" class="slider"
					><input id="srgbR_input" type="number" min="0.0" max="255.0" step="any"
				></div
				><div
					><label for="srgbG_input">Green</label
					><input id="srgbG_input" type="range" min="0.0" max="255.0" step="any" class="slider"
					><input id="srgbG_input" type="number" min="0.0" max="255.0" step="any"
				></div
				><div
					><label for="srgbB_input">Blue</label
					><input id="srgbB_input" type="range" min="0.0" max="255.0" step="any" class="slider"
					><input id="srgbB_input" type="number" min="0.0" max="255.0" step="any"
				></div

				><div><h3>sRGB (linear)</h3></div
				><div
					><label for="lsrgbR_input">Red</label
					><input id="lsrgbR_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="lsrgbR_input" type="number" min="0.0" max="1.0" step="any"
				></div
				><div
					><label for="lsrgbG_input">Green</label
					><input id="lsrgbG_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="lsrgbG_input" type="number" min="0.0" max="1.0" step="any"
				></div
				><div
					><label for="lsrgbB_input">Blue</label
					><input id="lsrgbB_input" type="range" min="0.0" max="1.0" step="any" class="slider"
					><input id="lsrgbB_input" type="number" min="0.0" max="1.0" step="any"
				></div

				><div><h3>Settings</h3></div
				><div
					><label for="resolution">Resolution</label
					><input id="resolution" type="range" min="201" max="401" value="301" step="2" class="slider"
				></div
				><div
					><label for="clip_gamut">Clip &gt; 1</label
					><input id="clip_gamut" type="checkbox"" checked
				></div
				><div
					><label for="clip_negative">Clip &lt; 0</label
					><input id="clip_negative" type="checkbox" checked
				></div
			></section
			><section class="frame" id="colour-output"
				><div class="swatch" id="picker-swatch"></div
				><p id="hex_out"></p
				><p id="oklab_out"></p
				><p id="oklch_out"></p
				><p id="hsl_out"></p
				><p id="srgb_out"></p>
			</section
		></main>

		<script>include('/sections/footer.html')</script>

		<script src="/scripts/colour-picker.js"></script>
	</body>
</html>
